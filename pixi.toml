[workspace]
authors = ["Benjamin-Yu-Sheng-Chang <benji.chang@mail.utoronto.ca>"]
channels = ["conda-forge"]
name = "fullhouse-hackathon"
platforms = ["win-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
cython = ">=3.2.5,<4"
python = "3.11.*"
setuptools = ">=82.0.1,<83"
wheel = ">=0.47.0,<0.48"
pip = ">=26.1.1,<27"
matplotlib = ">=3.10.9,<4"
numpy = ">=2.4.6,<3"
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.8.0,<2"
flask = ">=3.1.3,<4"
pytest = ">=9.0.3,<10"

[pypi-dependencies]
eval7 = "==0.1.10"
treys = ">=0.1.8, <0.2"
pkrbot = ">=1.1.0, <2"

[tool.uv.extra-build-dependencies]
eval7 = ["Cython"]

[tool.uv.no-build-isolation-package]
eval7 = true
